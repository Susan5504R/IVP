name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # cpu torch only, the full one is huge and CI has no gpu anyway
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pandas scikit-learn pytest
      - run: pytest -q
